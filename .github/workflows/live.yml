name: Live integration
# Manual only. Runs test-live/ against a real Drive with repo secrets.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override UNTRACE_BASE_URL (blank uses the repo secret)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: live-integration
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNTRACE_CLIENT_ID: ${{ secrets.UNTRACE_CLIENT_ID }}
      UNTRACE_CLIENT_SECRET: ${{ secrets.UNTRACE_CLIENT_SECRET }}
      UNTRACE_BASE_URL: ${{ inputs.base_url || secrets.UNTRACE_BASE_URL }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for v in UNTRACE_CLIENT_ID UNTRACE_CLIENT_SECRET UNTRACE_BASE_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing. Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:live
